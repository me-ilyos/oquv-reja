{% if form.non_field_errors %}
<div class="form-errors">{{ form.non_field_errors }}</div>
{% endif %}
<div class="form-grid">
  {% for field in form %}
  <div class="form-field{% if field.field.widget.input_type == "checkbox" or field.field.widget.input_type == "file" %} form-field-wide{% endif %}">
    {% include "web/parts/_maydon.html" %}
  </div>
  {% endfor %}
</div>
