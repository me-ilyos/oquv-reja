{% if field.field.widget.input_type == "checkbox" %}
<label>{{ field }} {{ label|default:field.label }}</label>
{% else %}
<label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
{{ field }}
{% endif %}
{% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
{{ field.errors }}
